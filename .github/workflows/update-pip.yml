# Checks newtrn/pip for a newer release and bumps Casks/pip.rb. Runs every
# few hours and can be started by hand from the Actions tab.
name: Update pip

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bump to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo newtrn/pip --json tagName -q .tagName)
          VERSION=${TAG#v}
          CURRENT=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/pip.rb)
          if [ "$VERSION" = "$CURRENT" ]; then echo "Already at $VERSION"; exit 0; fi
          gh release download "$TAG" --repo newtrn/pip --pattern "Pip-$VERSION.zip" --dir /tmp
          SHA=$(sha256sum "/tmp/Pip-$VERSION.zip" | cut -d' ' -f1)
          sed -i "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/pip.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "pip $VERSION"
          git push
